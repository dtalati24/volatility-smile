<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smile Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Smile Board</h1>
  <label>Slice <select id="slice"></select></label>
  <label title="Interior knots of the least squares spline base (more = follows the market more closely)">Knots <input id="knots" type="number" value="3" min="0" max="30" step="1"></label>
  <label title="Bell width = k x distance to the neighbouring nodes">k <input id="k" type="number" value="0.4" min="0.05" step="0.05"></label>
  <label title="Place the bells at the final smile's delta, or the spline base smile's">Delta <select id="delta">
    <option value="final">final smile</option><option value="base">base smile</option></select></label>
  <label title="How much one click moves a button">Step <select id="step">
    <option value="0.1">0.1 vol pt</option><option value="0.25" selected>0.25 vol pt</option>
    <option value="0.5">0.5 vol pt</option><option value="1">1 vol pt</option></select></label>
  <button id="refit" title="Fit a fresh spline and fresh bells to the mids; clears your offsets">Refit</button>
  <button id="autofit" title="Refit only the bells to the mids, keeping the spline and your offsets">Auto-fit bells</button>
  <label title="Refit the bells automatically when k, Delta or Stiffness change"><input id="auto" type="checkbox"> Auto</label>
  <label title="Automatic fitter only: how strongly the bells stay near their previous values (0 = pure fit). 1: moving a button 0.1 vol pt costs as much as one quote missing by 0.1 vol pt">Stiffness <input id="stiffness" type="number" value="0" min="0" step="0.5"></label>
  <button id="clear-offsets" title="Set your offsets to 0, keeping the fitted bells">Clear offsets</button>
  <button id="reset" title="Set every bell to 0: fitted values and offsets (keeps the spline base)">Zero buttons</button>
  <label><input id="full" type="checkbox"> Full strike range</label>
  <label title="SVI fitted to the same mids, for comparison only"><input id="show-svi" type="checkbox"> Show SVI</label>
  <span id="stats"></span>
</header>
<div id="alerts">
  <div id="error" hidden></div>
  <div id="stale" role="status" hidden></div>
</div>
<main>
  <section id="chart-panel">
    <div class="zoom">
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button id="zoom-reset" title="Back to the default view">Reset view</button>
    </div>
    <svg id="chart" role="img" aria-label="Implied volatility smile (drag to move along the strikes)"></svg>
    <div id="tooltip" hidden></div>
    <div class="legend">
      <span><i class="dot"></i> market mid</span>
      <span><i class="bar"></i> bid / ask</span>
      <span><i class="line base"></i> spline base</span>
      <span><i class="line model"></i> spline + bells</span>
      <span id="svi-legend" hidden><i class="line svi"></i> SVI (comparison)</span>
      <span><i class="line fwd"></i> forward</span>
    </div>
  </section>
  <section id="board-panel">
    <table id="board">
      <thead><tr>
        <th>Type</th><th>Strike</th><th>Delta</th><th>Bid</th><th>Ask</th><th>Mid</th><th>Model</th>
        <th>IV bid</th><th>IV mid</th><th>IV ask</th><th>Model IV</th><th title="Model IV minus mid IV">Model &minus; mid</th>
        <th>Vol</th><th>OI</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<footer>
  <div id="buttons"></div>
  <p class="hint">Click (left or right) a button to raise your offset by one step &middot; Ctrl + click to lower it &middot; each shows fitted + offset, in vol points</p>
</footer>
<script src="app.js"></script>
</body>
</html>
